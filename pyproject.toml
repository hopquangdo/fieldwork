[project]
name = "photo-sort"
version = "0.1.0"
description = "Sort BTS inspection photos into the report-appendix folder structure."
requires-python = ">=3.10"
dependencies = [
    # engine (LangGraph) + HTTP API
    "langgraph>=0.2.60",
    "tomli>=2 ; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    # ai_core
    "langchain-core>=0.3.29",
    "langchain>=0.3.14",
    "pydantic-settings>=2.0",
    "langchain-anthropic>=0.3.7",
    "langchain-openai>=0.2.14",
    # photo-sort
    "pillow>=10",
]

[project.scripts]
photo-sort = "app.cli.commands:cli_main"
photo-sort-eval = "app.cli.commands:eval_main"
photo-sort-engine = "app.cli.commands:engine_main"

[project.entry-points."photo_sort.features"]
photo-sort = "pipeline.feature:PhotoSortFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "app"]
sources = ["src"]
exclude = ["app/ui"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
