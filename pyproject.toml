[project]
name = "wincua-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "agent-core",
    "filesystem-tools",
    "bts-organizer",
    "langchain-community>=0.4.2",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
agent-core = { workspace = true }
filesystem-tools = { workspace = true }
bts-organizer = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = [
    "packages/agent-core/src",
    "packages/filesystem-tools/src",
    "apps/bts-organizer/src",
]
