[project]
name = "wincua-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "graphrun[api]",
    "filesystem-tools[agent]",
    "photo-sort[llm]",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
graphrun = { workspace = true }
agent-core = { workspace = true }
filesystem-tools = { workspace = true }
photo-sort = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = [
    "packages/graphrun/src",
    "packages/agent-core/src",
    "packages/filesystem-tools/src",
    "apps/photo-sort/src",
]
