[project]
name = "photo-sort"
version = "0.1.0"
description = "Sort BTS inspection photos into the report-appendix folder structure (a graphrun feature)."
requires-python = ">=3.10"
dependencies = [
    # graphrun (+ HTTP API)
    "langgraph>=0.2.60",
    "tomli>=2 ; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    # ai_core
    "langchain-core>=0.3.29",
    "langchain>=0.3.14",
    "pydantic-settings>=2.0",
    "langchain-anthropic>=0.3.7",
    "langchain-openai>=0.2.14",
    # photo-sort
    "pillow>=10",
]

[project.scripts]
photo-sort = "interfaces.cli.commands:cli_main"
photo-sort-eval = "interfaces.cli.commands:eval_main"
graphrun = "interfaces.cli.commands:graphrun_main"

[project.entry-points."graphrun.features"]
photo-sort = "pipeline.feature:PhotoSortFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
