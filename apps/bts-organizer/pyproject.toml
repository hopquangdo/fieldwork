[project]
name = "bts-organizer"
version = "0.1.0"
description = "Deterministic LangGraph pipeline that sorts BTS tower inspection photos into the report appendix structure."
requires-python = ">=3.10"
dependencies = [
    "agent-core",
    "filesystem-tools",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "pydantic>=2",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
bts-organize = "bts_organizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bts_organizer"]
