[project]
name = "photo-sort"
version = "0.1.0"
description = "Sort BTS inspection photos into the report-appendix folder structure (a graphrun feature)."
requires-python = ">=3.10"
dependencies = [
    "graphrun",
    "filesystem-tools[image]",
    "agent-core",
]

[project.scripts]
photo-sort = "photo_sort.cli:main"

[project.entry-points."graphrun.features"]
photo-sort = "photo_sort.feature:PhotoSortFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_sort"]
