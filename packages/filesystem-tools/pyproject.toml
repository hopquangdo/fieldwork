[project]
name = "filesystem-tools"
version = "0.1.0"
description = "Per-tool wrappers around LangChain's file-management tools (+ a custom image `view`), sandboxed and easy to customize."
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.29",
    "langchain-community>=0.3.14",
    "pydantic>=2",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_tools"]
