[project]
name = "filesystem-tools"
version = "0.2.0"
description = "Windows-safe filesystem primitives (fs_tools.winpath / fs_tools.fsops, zero deps) + optional image (fs_tools.media) and LangChain agent (fs_tools.agent) adapters."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["pillow>=10"]
agent = ["langchain-core>=0.3.29", "pydantic>=2", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_tools"]
