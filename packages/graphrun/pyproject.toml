[project]
name = "graphrun"
version = "0.1.0"
description = "LangGraph execution harness: run a graph with dry-run, resumable journal, staged reporting, config/rules and a feature registry."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60",
    "tomli>=2 ; python_version < '3.11'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2"]

[project.scripts]
graphrun = "graphrun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrun"]
