[project]
name = "agent-core"
version = "0.1.0"
description = "Reusable LLM agent runtime on the LangChain ecosystem: load any BaseTool, run a tool-calling loop."
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.29",
    "langchain>=0.3.14",
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3.7",
    "langchain-openai>=0.2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
